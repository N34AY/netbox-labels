[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-labels"
version = "0.2.0"
description = "QR code label templates for NetBox objects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Dmytro Penziakov" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/N34AY/netbox-labels"
Repository = "https://github.com/N34AY/netbox-labels"
Issues = "https://github.com/N34AY/netbox-labels/issues"

[project.optional-dependencies]
dev = ["ruff"]
# Builds docs/*.md into netbox_labels/static/docs/models/netbox_labels/ (see
# mkdocs.yml) — the static HTML NetBox's own "Model Documentation" links
# point to. Not needed to install/run the plugin, only to work on its docs.
docs = ["mkdocs-material"]

[tool.setuptools.packages.find]
include = ["netbox_labels*"]

[tool.setuptools.package-data]
netbox_labels = [
    "templates/**/*",
    "static/**/*",
    "migrations/*",
    "locale/**/*",
]

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Real-bug rules only (unused/undefined names, syntax errors, basic pycodestyle
# errors) — deliberately not the wider stylistic/opinionated rule families,
# which would fight choices made elsewhere in this codebase for good reason
# (e.g. the broad `except Exception` catches in views.py, each with a comment
# explaining why a narrower catch wouldn't do).
select = ["E4", "E7", "E9", "F"]
